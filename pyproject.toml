[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seven-dimension-content-gravity"
version = "0.1.0"
description = "A model-agnostic editorial review framework and CLI for selecting 2-4 high-impact content dimensions."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jason Kou" }]
keywords = ["editorial", "writing", "ai", "content-review", "agent-skill"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing",
]
dependencies = []

[project.scripts]
content-gravity = "content_gravity.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/content_gravity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
